# Sitting down against a wall to sleep, and getting up again. Drawn against a
# wall on her left: the anchor is the side that touches it, and frame 0, before
# she sits and after she gets up, is her standing pose.
scale = 0.5
anchor = [2, 209]
between_feet = [60, 209] # her feet in frame 0

# She sits down and stays asleep on frame 4.
[actions.sleep]
priority = 1
motion = "wall"
next = "sleep.sleep.4"
steps = [
  { frame = "0", duration = 1.2 },
  { frame = "1", duration = 7 },
  { frame = "2", duration = 4.5 },
  { frame = "3", duration = 6 },
  { frame = "4" },
]

[actions.wake]
priority = 1
motion = "wall"
steps = [
  { frame = "4", duration = 2 },
  { frame = "3", duration = 2.5 },
  { frame = "2", duration = 2.5 },
  { frame = "1", duration = 3 },
  { frame = "0", duration = 1.2 },
]
